name: Deploy to static server

on:
  push:
    branches:
      - "2025"
  schedule:
    - cron: "0 0 * * *" # every day at midnight
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Download data
        run: uv run make download EXCLUDE="schedule youtube" > /dev/null 2>&1
        env:
          PRETALX_TOKEN: ${{ secrets.PRETALX_TOKEN }}

      - name: Transform data
        run: uv run make transform EXCLUDE="schedule youtube" > /dev/null 2>&1

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: data/public/plc25

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
